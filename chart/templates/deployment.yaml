apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.tenant }}-web
  labels: { app: web, tenant: {{ .Values.tenant }} }
spec:
  selector:
    matchLabels: { app: web, tenant: {{ .Values.tenant }} }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: web, tenant: {{ .Values.tenant }} }
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8080 }]
          env:
            - { name: TENANT, value: "{{ .Values.tenant }}" }
            - { name: APP_VERSION, value: "{{ .Values.image.tag }}" }
            - { name: KAFKA_BOOTSTRAP, value: "{{ .Values.kafka.bootstrap }}" }
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readinessPath }}, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.probes.livenessPath }}, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
