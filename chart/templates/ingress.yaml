apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.tenant }}-web
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  ingressClassName: nginx
  tls:
    - secretName: {{ .Values.tenant }}-tls
      hosts:
        {{- range .Values.domains }}
        - {{ . }}
        {{- end }}
  rules:
    {{- range .Values.domains }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.tenant }}-web
                port: { number: 80 }
    {{- end }}
